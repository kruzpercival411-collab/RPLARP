<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#110e16">
<title>Cast — roleplay, together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110e16;--bg2:#17131e;--bg3:#1c1725;--panel:#241e2f;--panel2:#2c2539;--line:#332b40;
  --text:#efe9f4;--muted:#9d93ab;--faint:#6f667c;
  --accent:#e9a24e;--accent-ink:#1b1206;--rose:#d4637a;--ok:#56c88a;--idle:#e3bf4f;--danger:#e0566a;
  --dlg:#f5d7a8;--act:#c9bdd8;--mention-bg:rgba(233,162,78,.16);
  --r:14px;--rs:9px;--fs:15px;
  --display:'Fraunces',Georgia,serif;--body:'DM Sans',system-ui,-apple-system,sans-serif;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
:root[data-theme="light"]{
  --bg:#ece7f0;--bg2:#f4f0f7;--bg3:#fbf9fc;--panel:#ffffff;--panel2:#f1ecf5;--line:#ddd4e4;
  --text:#221b2b;--muted:#6c6178;--faint:#9a90a6;--dlg:#8a4c0c;--act:#5d4f6e;--accent-ink:#fff;
  --mention-bg:rgba(233,162,78,.2);
}
:root[data-theme="midnight"]{
  --bg:#05070d;--bg2:#0a0e17;--bg3:#0d121c;--panel:#141b28;--panel2:#1a2333;--line:#232d40;
  --text:#e6ecf5;--muted:#8d9ab0;--faint:#5b6880;--dlg:#bcd6ff;--act:#a9b6cc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 var(--fs)/1.45 var(--body);overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
html.kb #nav{display:none!important}
@media (max-width:820px){html.kb #side,html.kb #main{bottom:0!important}}
@media (hover:none){.msg:hover{background:none}.ch:hover,.mem:hover,.mi:hover{background:none}.ch.on{background:var(--panel2)}.mi.on{background:var(--panel)}}
a{color:var(--accent)}
img{display:block}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.h-display{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:.86em}.tiny{font-size:.76em}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:var(--panel2);font-weight:500;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{height:32px;padding:0 12px;font-size:.88em}
.btn:disabled{opacity:.5;pointer-events:none}
.ibtn{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted);font-size:18px;flex:none}
.ibtn:hover{background:var(--panel);color:var(--text)}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:.8em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);padding:11px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:80px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1;min-width:90px;border:1px solid var(--line);border-radius:var(--rs);padding:10px;cursor:pointer;text-align:center}
.seg input{display:none}.seg label:has(input:checked){border-color:var(--accent);background:var(--mention-bg)}
.check{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* avatars */
.av{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:var(--panel2);display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;overflow:hidden;position:relative}
.av.sm{width:28px;height:28px;font-size:11px}.av.xs{width:20px;height:20px;font-size:9px}.av.lg{width:84px;height:84px;font-size:30px}.av.xl{width:120px;height:120px;font-size:42px}
.av img{width:100%;height:100%;object-fit:cover}
.dotwrap{position:relative;flex:none}
.pdot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--bg2);background:var(--faint)}
.pdot.online{background:var(--ok)}.pdot.idle{background:var(--idle)}

/* shell */
#shell{display:grid;grid-template-columns:76px 256px minmax(0,1fr) 268px;height:100dvh}
#shell.noside{grid-template-columns:76px 0 minmax(0,1fr) 0}
#shell.noright{grid-template-columns:76px 256px minmax(0,1fr) 0}
#shell.noside.noright{grid-template-columns:76px 0 minmax(0,1fr) 0}
#rail{background:var(--bg);padding:calc(10px + var(--sat)) 0 10px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow-y:auto;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.rl{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:20px;background:var(--bg2);color:var(--muted);position:relative;transition:.15s;flex:none}
.rl:hover,.rl.on{border-radius:13px;background:var(--panel);color:var(--text)}
.rl.on::before{content:"";position:absolute;left:-14px;width:4px;height:28px;border-radius:0 4px 4px 0;background:var(--accent)}
.rl img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.rl .ini{font-family:var(--display);font-weight:700;font-size:17px;color:var(--text)}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.rail-sep{width:30px;height:2px;border-radius:2px;background:var(--line);margin:4px 0;flex:none}
.rl.add{color:var(--ok);font-size:24px}
#side{background:var(--bg2);display:flex;flex-direction:column;min-width:0;overflow:hidden;border-right:1px solid var(--line)}
#main{background:var(--bg3);display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}
#right{background:var(--bg2);overflow:hidden;display:flex;flex-direction:column;border-left:1px solid var(--line);min-width:0}
#nav{display:none}

/* sidebar */
.side-head{padding:calc(14px + var(--sat)) 14px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.side-head .t{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15}
.world-banner{height:96px;background:var(--panel) center/cover;position:relative}
.world-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--bg2))}
.side-scroll{flex:1;overflow-y:auto;padding:8px 8px 20px}
.grp{display:flex;align-items:center;gap:6px;padding:16px 8px 6px;font-size:.72em;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--faint)}
.grp .ibtn{width:24px;height:24px;font-size:16px;margin-left:auto}
.ch{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;color:var(--muted);cursor:pointer;min-height:38px}
.ch:hover{background:var(--panel);color:var(--text)}
.ch.on{background:var(--panel2);color:var(--text);font-weight:500}
.ch .ic{width:20px;text-align:center;flex:none;opacity:.85}
.ch .gear{opacity:0;margin-left:auto;font-size:14px;padding:2px 4px}
.ch:hover .gear,.ch.on .gear{opacity:.7}
.ch.scene{padding-left:30px;font-size:.92em;min-height:32px}
.me-card{padding:10px 12px calc(10px + var(--sab));border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--bg)}
.wstrip{display:none}

/* main headers */
.mhead{min-height:58px;padding:calc(8px + var(--sat)) 12px 8px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:var(--bg3);flex:none;z-index:2}
.mhead .title{font-weight:700;font-size:16px}
.mhead .sub{font-size:.8em;color:var(--muted)}
.back{display:none}
.playas{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 5px;border-radius:999px;background:var(--panel);border:1px solid var(--line);max-width:240px;flex:none}
.playas:hover{border-color:var(--accent)}
.playas .lbl{font-size:.72em;color:var(--muted);line-height:1}
.playas .nm{font-weight:700;font-size:.92em;line-height:1.15}
.page{flex:1;overflow-y:auto;padding:28px clamp(16px,4vw,48px) calc(40px + var(--sab))}
.page h1{font-family:var(--display);font-size:clamp(26px,4vw,36px);margin:0 0 6px;letter-spacing:-.02em}
.page h2{font-family:var(--display);font-size:20px;margin:28px 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.15s;text-align:left;display:flex;flex-direction:column}
.wcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.wcard .cov{height:110px;background:var(--panel2) center/cover;display:grid;place-items:center;font-family:var(--display);font-size:38px;font-weight:700;color:var(--muted)}
.wcard .bd{padding:12px 14px 14px}
.wcard .nm{font-weight:700;font-size:16px}
.wcard .ds{color:var(--muted);font-size:.88em;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;cursor:pointer;transition:.15s;position:relative}
.ccard:hover{border-color:var(--accent)}
.ccard .av{border:3px solid var(--cc,var(--line))}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74em;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);font-weight:500}
.newcard{border-style:dashed;justify-content:center;color:var(--muted);min-height:180px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.flow span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85em}

/* messages */
#msgs{flex:1;overflow-y:auto;padding:16px 0 8px;overflow-anchor:none}
.daysep{display:flex;align-items:center;gap:12px;margin:18px 16px 8px;font-size:.75em;color:var(--faint);font-weight:700;letter-spacing:.05em}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:grid;grid-template-columns:44px 1fr;column-gap:12px;padding:6px 18px 2px;position:relative}
.msg.grouped{padding-top:1px}
.msg:hover{background:color-mix(in srgb,var(--panel) 45%,transparent)}
.msg.hl{animation:hl 2.2s ease}
@keyframes hl{0%,40%{background:var(--mention-bg)}100%{background:transparent}}
.msg.mentioned{background:var(--mention-bg);box-shadow:inset 3px 0 var(--accent)}
.msg .gut{grid-column:1;grid-row:1/span 3;padding-top:2px}
.msg .mc{grid-column:2;min-width:0}
.msg.grouped .gut{font-size:.68em;color:var(--faint);opacity:0;text-align:right;padding-top:5px}
.msg.grouped:hover .gut{opacity:1}
.msg .meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.msg .who{font-weight:700;cursor:pointer;color:var(--nc,var(--text))}
.msg .who:hover{text-decoration:underline}
.msg .pb{font-size:.74em;color:var(--faint);cursor:pointer}
.msg .pb:hover{color:var(--muted)}
.msg .tm{font-size:.72em;color:var(--faint)}
.tag{font-size:.66em;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--muted);text-transform:uppercase}
.body{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;min-width:0}
.body em{font-style:italic}
.body .dlg{color:var(--dlg)}
.body .q{display:inline-block;border-left:3px solid var(--line);padding-left:10px;color:var(--muted)}
.body code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:.9em}
.body .mention{background:var(--mention-bg);color:var(--accent);padding:0 3px;border-radius:5px;font-weight:500;cursor:pointer}
.body .spoiler{background:var(--text);color:transparent;border-radius:4px;cursor:pointer}.body .spoiler.open{background:var(--panel2);color:inherit}
.edited{font-size:.7em;color:var(--faint);margin-left:4px}
.deleted{color:var(--faint);font-style:italic;font-size:.9em}
.rep{display:flex;align-items:center;gap:6px;font-size:.8em;color:var(--muted);margin:0 0 3px;cursor:pointer;min-width:0;grid-column:2}
.rep::before{content:"↱";color:var(--faint)}
.rep b{color:var(--text);font-weight:500;flex:none}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.atts img{max-width:min(360px,100%);max-height:320px;border-radius:12px;cursor:zoom-in;background:var(--panel2);object-fit:cover}
.fcard{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:340px;text-decoration:none;color:var(--text)}
.rx{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.rx button{display:inline-flex;gap:5px;align-items:center;height:28px;padding:0 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.86em}
.rx button.mine{border-color:var(--accent);background:var(--mention-bg)}
.mact{position:absolute;right:14px;top:-14px;display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:3}
.msg:hover .mact{display:flex}
.mact button{width:32px;height:32px;border-radius:8px;font-size:15px}
.mact button:hover{background:var(--panel2)}
.loadmore{display:block;margin:4px auto 12px}
.chan-intro{padding:28px 18px 10px}
.chan-intro .big{width:60px;height:60px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:28px;margin-bottom:10px}

/* composer */
#typing{height:20px;padding:0 20px;font-size:.78em;color:var(--muted);flex:none}
.composer{padding:0 14px calc(12px + var(--sab));flex:none}
.cbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px;display:flex;flex-direction:column}
.cbox:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.crow{display:flex;align-items:flex-end;gap:4px}
.cchip{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px 0 4px;border-radius:999px;background:var(--panel2);flex:none;max-width:44%}
.cchip .nm{font-weight:700;font-size:.86em}
#ctext{flex:1;min-width:0;border:0;outline:0;background:transparent;resize:none;padding:9px 6px;font-size:16px;line-height:1.4;max-height:40vh}
.send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px;flex:none;font-weight:700}
.cbar{display:flex;align-items:center;gap:8px;padding:4px 8px 6px;font-size:.8em;color:var(--muted)}
.cbar b{color:var(--text)}
.pend{display:flex;gap:8px;flex-wrap:wrap;padding:6px}
.pend .pi{position:relative;width:72px;height:72px;border-radius:12px;background:var(--panel2);overflow:hidden;display:grid;place-items:center;font-size:.7em;text-align:center;padding:4px}
.pend .pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pend .pi button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;z-index:1}
.readonly-note{padding:14px;text-align:center;color:var(--muted);font-size:.9em;background:var(--panel);border-radius:14px}

/* popovers / modals / sheets */
#overlay{position:fixed;inset:0;background:rgba(5,3,8,.6);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;width:min(520px,100%);max-height:min(88dvh,820px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .18s ease}
.modal.wide{width:min(720px,100%)}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.mh{display:flex;align-items:center;gap:10px;padding:16px 16px 10px 20px}
.mh .t{font-family:var(--display);font-weight:700;font-size:20px;flex:1}
.mb{padding:4px 20px 20px;overflow-y:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;border-top:1px solid var(--line)}
.pop{position:fixed;z-index:60;background:var(--bg2);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.45);width:300px;max-height:70vh;overflow:auto;padding:6px;animation:pop .14s ease}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;text-align:left;min-height:44px}
.mi:hover,.mi.on{background:var(--panel)}
.mi.on{box-shadow:inset 0 0 0 1px var(--accent)}
.mi .sub{font-size:.76em;color:var(--muted)}
.mi.dz{color:var(--danger)}
.ptitle{padding:8px 10px 4px;font-size:.72em;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--faint)}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:auto;cursor:pointer;max-width:90vw;animation:pop .2s}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:82dvh;border-radius:10px;object-fit:contain}
#lightbox .lbbar{display:flex;gap:10px}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px}
.lbnav.l{left:16px}.lbnav.r{right:16px}

/* profile popup */
.cp-hero{position:relative;margin:-4px -20px 0;height:150px;background:var(--panel) center/cover;border-radius:0}
.cp-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,var(--bg2))}
.cp-av{margin:-62px 0 0;position:relative;z-index:1;border:4px solid var(--bg2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:14px 0;font-size:.92em}
.kv dt{color:var(--muted);font-weight:500}.kv dd{margin:0}
.sect{margin:18px 0 6px;font-size:.72em;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--faint)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gal .gi{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--panel2);cursor:zoom-in}
.gal .gi img{width:100%;height:100%;object-fit:cover}
.gal .gi .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px}
.gal .gi .star{position:absolute;bottom:4px;left:4px;height:22px;padding:0 7px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font-size:11px}
.gal .add{display:grid;place-items:center;border:1px dashed var(--line);color:var(--muted);font-size:26px;cursor:pointer}
.prose{white-space:pre-wrap;color:var(--text);opacity:.92}

/* right panel */
.rtabs{display:flex;gap:4px;padding:calc(12px + var(--sat)) 10px 8px;border-bottom:1px solid var(--line)}
.rtabs button{flex:1;height:34px;border-radius:9px;color:var(--muted);font-weight:500;font-size:.9em}
.rtabs button.on{background:var(--panel);color:var(--text)}
.mem{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;cursor:pointer}
.mem:hover{background:var(--panel)}
.mem.off{opacity:.55}
.rolechip{font-size:.66em;padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}

/* notifications */
.nitem{display:flex;gap:12px;padding:12px;border-radius:14px;cursor:pointer;align-items:flex-start;border:1px solid transparent}
.nitem:hover{background:var(--panel)}
.nitem.unread{background:color-mix(in srgb,var(--accent) 7%,transparent);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.nitem .ico{width:40px;height:40px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:19px;flex:none}
.sres{padding:12px;border-radius:12px;cursor:pointer;border:1px solid var(--line);margin-bottom:8px;background:var(--panel)}
.sres:hover{border-color:var(--accent)}

/* auth */
.auth{min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.auth .art{background:radial-gradient(120% 80% at 20% 10%,#3a2346 0%,transparent 60%),radial-gradient(90% 70% at 90% 90%,#4a2b14 0%,transparent 55%),var(--bg);padding:48px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.auth .art h1{font-family:var(--display);font-size:clamp(36px,5vw,64px);line-height:1.02;margin:0 0 16px;letter-spacing:-.03em;max-width:12ch}
.auth .art h1 em{color:var(--accent);font-style:italic}
.auth .demo{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;max-width:440px;margin-bottom:28px;backdrop-filter:blur(6px)}
.auth .demo .msg{padding:6px 0;grid-template-columns:36px 1fr}
.auth .demo .av{width:36px;height:36px}
.auth .form{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.auth .form>div{width:min(380px,100%)}
.logo{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px}
.switch-link{background:none;color:var(--accent);font-weight:500}
.err{color:var(--danger);font-size:.88em;min-height:1.2em;margin:6px 0}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center{display:grid;place-items:center;height:100dvh}

/* ========== MOBILE ========== */
@media (max-width:820px){
  #shell,#shell.noside,#shell.noright,#shell.noside.noright{display:block;height:100dvh;position:relative;overflow:hidden}
  #rail{display:none}
  #side,#main{position:absolute;inset:0;border:0}
  #side{z-index:2;bottom:calc(60px + var(--sab))}
  #main{z-index:1;bottom:calc(60px + var(--sab))}
  #shell[data-mpane="side"] #main{visibility:hidden}
  #shell[data-mpane="main"] #side{visibility:hidden}
  #shell.chatting #main{bottom:0;z-index:5}
  #shell.chatting #nav{display:none}
  #right{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);z-index:40;transform:translateX(105%);transition:transform .22s ease;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  #right.open{transform:none}
  #nav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(60px + var(--sab));padding-bottom:var(--sab);background:var(--bg);border-top:1px solid var(--line);z-index:10}
  #nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--faint);position:relative}
  #nav button .e{font-size:21px;filter:grayscale(.6);opacity:.75}
  #nav button.on{color:var(--text)}#nav button.on .e{filter:none;opacity:1}
  #nav .badge{top:4px;right:calc(50% - 22px)}
  .back{display:inline-grid}
  .me-card{display:none}
  .wstrip{display:flex;gap:8px;overflow-x:auto;padding:calc(10px + var(--sat)) 12px 10px;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
  .wstrip::-webkit-scrollbar{display:none}
  .wstrip .rl{width:44px;height:44px}
  .wstrip .rl.on::before{display:none}.wstrip .rl.on{box-shadow:0 0 0 2px var(--accent)}
  .side-head{padding-top:12px}
  .mhead{padding-left:6px}
  .mhead .sub{display:none}
  .msg{padding:6px 12px 2px;grid-template-columns:38px 1fr;column-gap:10px}
  .msg .av{width:38px;height:38px}
  .mact{display:none!important}
  .playas{max-width:150px;padding-right:10px}
  .playas .lbl{display:none}
  .composer{padding:0 8px calc(8px + var(--sab))}
  #overlay{align-items:flex-end;padding:0}
  .modal{width:100%;border-radius:22px 22px 0 0;max-height:92dvh;animation:up .22s ease;padding-bottom:var(--sab)}
  .modal.wide{width:100%}
  @keyframes up{from{transform:translateY(40%);opacity:.4}}
  .pop{left:8px!important;right:8px!important;width:auto;max-height:60dvh;border-radius:20px}
  html.app,html.app body{position:fixed;inset:0;overflow:hidden}
  #shell,#shell.noside,#shell.noright,#shell.noside.noright{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh)}
  #overlay{top:var(--vvt,0px);bottom:auto;height:var(--vvh,100dvh)}
  .auth{grid-template-columns:1fr}
  .auth .art{min-height:0;padding:calc(64px + var(--sat)) 20px 8px}
  .auth .demo{display:none}
  .auth .art h1{font-size:30px;margin-bottom:8px}
  .auth .art p{font-size:.9em}
  .auth .form{align-items:flex-start;padding:20px 20px calc(40px + var(--sab))}
  .page{padding:calc(18px + var(--sat)) 16px calc(30px + var(--sab))}
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div></div></div>
<div id="overlay"></div>
<div id="toast"></div>
<div id="lightbox"><button class="lbnav l" data-act="lb-prev">‹</button><img alt=""><div class="lbbar"><a class="btn sm" target="_blank" rel="noopener">Open original</a><button class="btn sm" data-act="lb-close">Close</button></div><button class="lbnav r" data-act="lb-next">›</button></div>
<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileAny" multiple hidden>

<script type="module">
/* =====================================================================
   CAST — a roleplay platform for humans.
   1) Paste your Supabase Project URL and anon public key below.
   2) Run schema.sql in Supabase once.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://cbhcqtayqdjluygjwsxr.supabase.co',        // e.g. 'https://abcdxyz.supabase.co'
  SUPABASE_ANON_KEY: 'sb_publishable_opuwemaktWr9O8iRi7mH2w_-_2Veayl',   // the "anon public" key from Project Settings → API
};

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isMobile = () => matchMedia('(max-width:820px)').matches;
const LS = {
  get(k, d) { try { const v = localStorage.getItem('cast_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('cast_' + k, JSON.stringify(v)); } catch {} },
};
const RANK = { owner: 5, admin: 4, moderator: 3, member: 2, guest: 1 };
const ROLE_META = { owner: ['👑', 'Owner'], admin: ['🛠️', 'Admin'], moderator: ['🛡️', 'Moderator'], member: ['👤', 'Member'], guest: ['👁️', 'Guest'] };
const QUICK = ['❤️', '😂', '😭', '🔥', '👍', '👀'];
const MORE_EMO = ['❤️', '😂', '😭', '🔥', '👍', '👀', '😳', '🥺', '💀', '✨', '😤', '🙏', '💔', '😈', '🤝', '😮', '🎭', '⚔️'];
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
function av(url, name, cls = '') {
  if (url) return `<div class="av ${cls}"><img src="${esc(url)}" alt="" loading="lazy"></div>`;
  return `<div class="av ${cls}" style="background:hsl(${hue(name)} 38% 38%)">${esc(initials(name))}</div>`;
}
function fmtSize(b) { return b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB'; }
function fmtTime(ts) {
  const d = new Date(ts), now = new Date();
  const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return 'Today at ' + t;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday at ' + t;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' }) + ' ' + t;
}
function fmtDay(ts) { return new Date(ts).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); }
function ago(ts) {
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd'; return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function toast(msg, onClick) {
  const el = document.createElement('div'); el.className = 'tst'; el.textContent = msg;
  if (onClick) el.onclick = () => { onClick(); el.remove(); };
  $('#toast').appendChild(el); setTimeout(() => el.remove(), 4200);
}
function errMsg(e) { return e?.message || e?.error_description || String(e); }
const slug = s => String(s).toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'channel';

/* RP-aware formatting: *actions*, "dialogue", **bold**, ~~strike~~, ||spoilers||, > quotes, links, @mentions */
function fmt(text, mentions = []) {
  let h = esc(text);
  const links = [];
  h = h.replace(/https?:\/\/(?:(?!&quot;|&lt;|&gt;|&#39;)[^\s<])+/g, u => {
    let tail = ''; const m = u.match(/[.,;:!?)\]]+$/); if (m) { tail = m[0]; u = u.slice(0, -tail.length); }
    links.push(u); return `\u0001${links.length - 1}\u0001` + tail;
  });
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^\w*])\*([^*\n]+?)\*(?![\w*])/g, '$1<em>$2</em>')
    .replace(/(^|[^\w])_([^_\n]+?)_(?!\w)/g, '$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
    .replace(/\|\|([^|\n]+)\|\|/g, '<span class="spoiler" data-act="spoil">$1</span>')
    .replace(/(&quot;|“)([^\n]*?)(&quot;|”)/g, '<span class="dlg">$1$2$3</span>');
  h = h.split('\n').map(l => l.startsWith('&gt; ') ? `<span class="q">${l.slice(5)}</span>` : l).join('\n');
  for (const m of mentions) {
    if (!m?.l) continue;
    const tok = '@' + esc(m.l);
    h = h.split(tok).join(`<span class="mention" data-act="${m.c ? 'char' : 'user'}" data-id="${esc(m.c || m.u)}">${tok}</span>`);
  }
  h = h.replace(/\u0001(\d+)\u0001/g, (_, i) => { const u = links[+i]; return `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`; });
  return h;
}

/* ---------- state ---------- */
let sb, me = null;
const S = {
  tab: 'home', mpane: 'main',
  worlds: [], role: {}, world: null, channels: [], members: [], worldChars: [], blocks: new Set(), follows: new Set(),
  chan: null, msgs: [], hasMore: true, loadingMsgs: false, extraMsgs: {},
  profiles: {}, chars: {}, myChars: [], dms: [], notifs: [], presence: {}, typing: {},
  replyTo: null, editing: null, pending: [], mentionPicks: [], showRight: LS.get('showRight', true), rightTab: 'members',
  publicWorlds: [], discoverQ: '',
};
let room = null, worldSub = null, presCh = null, notifSub = null, dmSub = null;

/* ---------- boot ---------- */
const URL_ = CONFIG.SUPABASE_URL || LS.get('url', '');
const KEY_ = CONFIG.SUPABASE_ANON_KEY || LS.get('key', '');
applyTheme();
if (window.visualViewport) {
  const vv = visualViewport;
  const fit = () => {
    const list = document.getElementById('msgs'); const pinned = list && list.scrollHeight - list.scrollTop - list.clientHeight < 160;
    const r = document.documentElement.style; r.setProperty('--vvh', vv.height + 'px'); r.setProperty('--vvt', vv.offsetTop + 'px');
    document.documentElement.classList.toggle('kb', isMobile() && vv.height < innerHeight * 0.8);
    if (pinned) requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; });
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
}
document.addEventListener('focusin', e => {
  const a = e.target; if (!isMobile() || !document.getElementById('shell') || a.id === 'ctext' || !a.matches?.('input,textarea')) return;
  setTimeout(() => a.scrollIntoView({ block: 'nearest' }), 350);
});
if (!URL_ || !KEY_) renderSetup(); else boot();

function applyTheme() {
  const t = LS.get('theme', 'dark'); document.documentElement.dataset.theme = t;
  const a = LS.get('accent', ''); if (a) document.documentElement.style.setProperty('--accent', a);
  const fs = LS.get('fs', 15); document.documentElement.style.setProperty('--fs', fs + 'px');
}

function renderSetup() {
  $('#app').innerHTML = `<div class="center"><div style="width:min(460px,92vw)">
    <div class="logo" style="margin-bottom:18px"><i>🎭</i>Cast</div>
    <h2 class="h-display" style="margin:0 0 6px">Connect your backend</h2>
    <p class="muted small">Paste your Supabase project URL and anon key. For everyone to use the app, put these into the <code>CONFIG</code> block at the top of index.html — this box only saves them on this device for testing.</p>
    <label class="field"><span>Project URL</span><input class="inp" id="su" placeholder="https://xxxx.supabase.co"></label>
    <label class="field"><span>Anon public key</span><input class="inp" id="sk" placeholder="eyJhbGciOi..."></label>
    <button class="btn primary" id="sgo" style="width:100%">Connect</button></div></div>`;
  $('#sgo').onclick = () => { LS.set('url', $('#su').value.trim()); LS.set('key', $('#sk').value.trim()); location.reload(); };
}

async function boot() {
  sb = createClient(URL_, KEY_, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  const { data: { session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev, sess) => {
    if (ev === 'SIGNED_IN' && !me && sess) start(sess.user);
    if (ev === 'SIGNED_OUT') location.reload();
  });
  if (session) start(session.user); else renderAuth();
}

/* ---------- auth ---------- */
function renderAuth(mode = 'in') {
  const demo = (n, c, col, body, pb) => `<div class="msg"><div class="gut">${av('', n)}</div><div><div class="meta"><span class="who" style="color:${col}">${n}</span><span class="pb">played by ${pb}</span></div><div class="body">${fmt(body)}</div></div></div>`;
  $('#app').innerHTML = `<div class="auth">
    <div class="art">
      <div class="logo" style="position:absolute;top:calc(28px + var(--sat));left:28px"><i>🎭</i>Cast</div>
      <div class="demo">
        ${demo('Mia Thompson', '', '#f0a9b8', '*walks into the cafeteria and looks around.*\n"Has anyone seen Jayden?"', 'Kruz')}
        ${demo('Jayden', '', '#9fc8f2', '*looks up from his phone.* "You mean me?"', 'Alex')}
      </div>
      <h1>Your characters. <em>Your worlds.</em> Together.</h1>
      <p class="muted" style="max-width:46ch;margin:0">Worlds, channels, characters and instant switching. No bots, no proxy commands — pick who you're playing and write.</p>
    </div>
    <div class="form"><div>
      <h2 class="h-display" style="font-size:28px;margin:0 0 4px">${mode === 'in' ? 'Welcome back' : 'Create your account'}</h2>
      <p class="muted small" style="margin:0 0 20px">${mode === 'in' ? 'Sign in to get back to your worlds.' : 'Takes ten seconds. Your characters follow you everywhere.'}</p>
      ${mode === 'up' ? `<label class="field"><span>Username</span><input class="inp" id="au" autocomplete="username" placeholder="kruz"></label>` : ''}
      <label class="field"><span>Email</span><input class="inp" id="ae" type="email" autocomplete="email"></label>
      <label class="field"><span>Password</span><input class="inp" id="ap" type="password" autocomplete="${mode === 'in' ? 'current-password' : 'new-password'}"></label>
      <div class="err" id="aerr"></div>
      <button class="btn primary" id="ago" style="width:100%">${mode === 'in' ? 'Sign in' : 'Create account'}</button>
      <p class="small muted" style="text-align:center;margin-top:16px">${mode === 'in' ? 'New here?' : 'Already have an account?'} <button class="switch-link" id="asw">${mode === 'in' ? 'Create an account' : 'Sign in'}</button></p>
      ${mode === 'in' ? `<p class="small" style="text-align:center"><button class="switch-link" id="afp">Forgot password?</button></p>` : ''}
    </div></div></div>`;
  $('#asw').onclick = () => renderAuth(mode === 'in' ? 'up' : 'in');
  $('#afp') && ($('#afp').onclick = async () => {
    const email = $('#ae').value.trim(); if (!email) return $('#aerr').textContent = 'Type your email first.';
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    $('#aerr').textContent = error ? errMsg(error) : 'Check your inbox for a reset link.';
  });
  const go = async () => {
    const email = $('#ae').value.trim(), password = $('#ap').value; $('#aerr').textContent = '';
    $('#ago').disabled = true;
    try {
      if (mode === 'in') {
        const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error;
      } else {
        const username = $('#au').value.trim().replace(/[^a-zA-Z0-9_]/g, '');
        if (username.length < 2) throw new Error('Username needs at least 2 letters or numbers.');
        if (password.length < 6) throw new Error('Password needs at least 6 characters.');
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username, display_name: username }, emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (!data.session) { $('#aerr').style.color = 'var(--ok)'; $('#aerr').textContent = 'Check your email to confirm your account, then sign in.'; }
      }
    } catch (e) { $('#aerr').style.color = ''; $('#aerr').textContent = errMsg(e); }
    $('#ago').disabled = false;
  };
  $('#ago').onclick = go;
  $$('.auth input').forEach(i => i.addEventListener('keydown', e => e.key === 'Enter' && go()));
}

/* ---------- start (signed in) ---------- */
let started = false;
async function start(user) {
  if (started) return; started = true;
  let tries = 0;
  while (!me && tries < 6) {
    const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (data) me = data; else { tries++; await new Promise(r => setTimeout(r, 500)); }
  }
  if (!me) { $('#app').innerHTML = `<div class="center"><div class="empty"><div class="big">⚠️</div>Your profile wasn't found. Did you run <b>schema.sql</b> in Supabase?<br><br><button class="btn" onclick="location.reload()">Retry</button></div></div>`; return; }
  S.profiles[me.id] = me;
  document.documentElement.classList.add('app');
  $('#app').innerHTML = `<div id="shell"><nav id="rail"></nav><aside id="side"></aside><main id="main"></main><aside id="right"></aside><nav id="nav"></nav></div>`;
  await Promise.all([loadWorlds(), loadMyChars(), loadDMs(), loadNotifs()]);
  startPresence(); subscribeGlobal();
  const join = (location.hash.match(/join=([\w-]+)/) || [])[1];
  if (join) { history.replaceState(null, '', location.pathname); showJoinPreview(join); }
  const last = LS.get('lastWorld', null);
  if (!isMobile() && last && S.worlds.find(w => w.id === last)) await openWorld(last);
  else render();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) catchUp(); });
}

async function loadWorlds() {
  const { data, error } = await sb.from('world_members').select('role, worlds(*)').eq('user_id', me.id);
  if (error) return toast(errMsg(error));
  S.worlds = (data || []).filter(r => r.worlds).map(r => r.worlds).sort((a, b) => a.name.localeCompare(b.name));
  S.role = {}; (data || []).forEach(r => r.worlds && (S.role[r.worlds.id] = r.role));
}
async function loadMyChars() {
  const { data } = await sb.from('characters').select('*').eq('owner_id', me.id).order('created_at');
  S.myChars = data || []; S.myChars.forEach(c => S.chars[c.id] = c);
}
async function loadDMs() {
  const { data } = await sb.from('dm_threads').select('*').order('last_at', { ascending: false });
  S.dms = data || [];
  await ensureProfiles(S.dms.flatMap(d => d.members));
  await ensureChars(S.dms.flatMap(d => [d.char_a, d.char_b]).filter(Boolean));
}
async function loadNotifs() {
  const { data } = await sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(100);
  S.notifs = data || [];
}
async function ensureProfiles(ids) {
  const need = [...new Set(ids)].filter(id => id && !S.profiles[id]);
  if (!need.length) return;
  const { data } = await sb.from('profiles').select('*').in('id', need);

/* ---------- presence (real, via Supabase Realtime) ---------- */
let idleTimer, myStatus = 'online';
function startPresence() {

  presCh.on('presence', { event: 'sync' }, () => {
    const st = presCh.presenceState(); S.presence = {};

    renderRight(); if (S.tab === 'messages') renderSide();
  }).subscribe(s => { if (s === 'SUBSCRIBED') presCh.track({ status: myStatus }); });
  const setStatus = st => { if (st !== myStatus) { myStatus = st; presCh.track({ status: st }); } };
  const bump = () => { setStatus(document.hidden ? 'idle' : 'online'); clearTimeout(idleTimer); idleTimer = setTimeout(() => setStatus('idle'), 5 * 60e3); };

}
const statusOf = id => S.presence[id] || 'offline';

/* ---------- global realtime subscriptions ---------- */
function subscribeGlobal() {

      } else toast(({ invite: '🏫 ', dm: '💬 ', mention: '@ ', reply: '↩️ ', follow: '🔔 ' }[n.kind] || '') + n.body, () => openNotif(n));
      S.notifs.unshift(n); renderRail(); renderNav(); if (S.tab === 'notifs') renderMain();

async function loadWorldData() {

    sb.from('channels').select('*').eq('world_id', id).order('position').order('created_at'),

    sb.from('world_char_blocks').select('character_id').eq('world_id', id),

  if (wd.data) { S.world = wd.data; const i = S.worlds.findIndex(w => w.id === id); if (i >= 0) S.worlds[i] = wd.data; }

}

async function openChannel(ch) {

  S.chan = ch; S.msgs = []; S.hasMore = true; S.replyTo = null; S.editing = null; S.pending = []; S.typing = {};
  if (!ch._dm) { const lc = LS.get('lastChan', {}); lc[S.world.id] = ch.id; LS.set('lastChan', lc); }

}

function subscribeRoom() {
  const c = S.chan, col = c._dm ? 'dm_id' : 'channel_id';
  room = sb.channel('room-' + c.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `${col}=eq.${c.id}` }, async p => {
      if (S.chan?.id !== c.id) return; await addIncoming([p.new]);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: `${col}=eq.${c.id}` }, p => {
      const i = S.msgs.findIndex(m => m.id === p.new.id); if (i >= 0) { S.msgs[i] = p.new; renderMsgs(); }
    })
    .on('broadcast', { event: 'typing' }, ({ payload }) => {

}
async function addIncoming(list) {

  if (!fresh.length) return;
  await ensureProfiles(fresh.map(m => m.author_id)); await ensureChars(fresh.map(m => m.character_id).filter(Boolean));
  fresh.forEach(m => delete S.typing[m.author_id]);
  S.msgs.push(...fresh); S.msgs.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

  const { data } = await sb.from('messages').select('*').eq(col, S.chan.id).gt('created_at', last).order('created_at').limit(200);

}
async function loadMessages(older = false) {

  const rows = (data || []).reverse(); S.hasMore = (data || []).length === 50;
  await hydrate(rows);
  const list = $('#msgs'); const prevH = list?.scrollHeight || 0, prevTop = list?.scrollTop || 0;

}
async function hydrate(rows) {

  if (missing.length) {

async function jumpTo(msgId, chanObj) {

}

      const items = $$('.mi', pop); let i = items.findIndex(x => x.classList.contains('on'));
      if (e.key === 'Escape') { pop.remove(); return; }
      e.preventDefault();
      if (e.key === 'ArrowDown') i = (i + 1) % items.length; else if (e.key === 'ArrowUp') i = (i - 1 + items.length) % items.length; else { items[Math.max(i, 0)]?.click(); return; }
      items.forEach((x, j) => x.classList.toggle('on', j === i)); return;
    }
    if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && isRP()) { e.preventDefault(); cycleChar(e.key === 'ArrowDown' ? 1 : -1); return; }

function msgHTML(m, prev) {
  const ch = m.character_id ? S.chars[m.character_id] : null;

  const t = new Date(m.created_at);
  const grouped = prev && !prev.deleted && !m.reply_to && prev.author_id === m.author_id && prev.character_id === m.character_id && (t - new Date(prev.created_at)) < 7 * 60e3;
  const name = ch ? ch.name : pname(m.author_id);
  const avatar = ch ? av(ch.avatar_url, ch.name) : av(au?.avatar_url, pname(m.author_id));
  const whoAct = ch ? `data-act="char" data-id="${ch.id}"` : `data-act="user" data-id="${m.author_id}"`;
  const mentioned = (m.mentions || []).some(x => x.u === me.id);
  const own = m.author_id === me.id, mod = !S.chan._dm && myRank() >= 3;
  let reply = '';
  if (m.reply_to) {
    const r = S.msgs.find(x => x.id === m.reply_to) || S.extraMsgs[m.reply_to];
    if (r) { const rn = r.character_id ? S.chars[r.character_id]?.name : pname(r.author_id); reply = `<div class="rep" data-act="jump" data-id="${r.id}"><b>${esc(rn || '')}</b><span class="ellip">${r.deleted ? '<i>deleted message</i>' : esc(r.content.slice(0, 120)) || '📎 attachment'}</span></div>`; }

let sending = false;
async function sendMessage() {
  const ta = $('#ctext'); if (!ta || sending) return;
  const text = ta.value.replace(/\s+$/, '');
  if (S.editing) {
    const id = S.editing; if (!text.trim()) return;
    const { error } = await sb.rpc('edit_message', { mid: id, body: text });
    if (error) return toast(errMsg(error));
    const m = S.msgs.find(x => x.id === id); if (m) { m.content = text; m.edited_at = new Date().toISOString(); renderMsgs('keep'); }
    cancelBar(); ta.value = ''; autosize(); return;
  }
  if (S.pending.some(a => a.uploading)) return toast('Hang on — still uploading…');
  if (!text.trim() && !S.pending.length) return;
  const cur = currentChar();
  const mentions = collectMentions(text);
  const row = {
    author_id: me.id, content: text, character_id: cur?.id || null,
    attachments: S.pending.map(({ url, path, name, type, size }) => ({ url, path, name, type, size })),
    mentions, reply_to: S.replyTo,
  };
  if (S.chan._dm) row.dm_id = S.chan.id; else row.channel_id = S.chan.id;
  sending = true; ta.value = ''; autosize(); const savedPend = S.pending; S.pending = []; renderPending(); const savedReply = S.replyTo; S.replyTo = null; renderBar(); S.mentionPicks = [];
  const { data, error } = await sb.from('messages').insert(row).select().single();
  sending = false;
  if (error) { ta.value = text; S.pending = savedPend; S.replyTo = savedReply; renderPending(); renderBar(); return toast('Couldn’t send: ' + errMsg(error)); }
  addIncoming([data]); const list = $('#msgs'); if (list) list.scrollTop = list.scrollHeight;
  if (isMobile()) ta.focus();
  botTriggers(data);
}
function collectMentions(text) {
  const out = [], seen = new Set();
  for (const p of S.mentionPicks) if (text.includes('@' + p.l) && !seen.has(p.l)) { out.push(p); seen.add(p.l); }
  // also catch plain @username for world members / DM partner
  const pool = S.chan._dm ? S.chan.members : S.members.map(m => m.user_id);
  for (const id of pool) { const u = S.profiles[id]?.username; if (u && text.includes('@' + u) && !seen.has(u)) { out.push({ u: id, c: null, l: u }); seen.add(u); } }
  return out.slice(0, 20);
}

/* ---------- uploads ---------- */
async function compress(file, max = 1600, q = .85) {
  if (!file.type.startsWith('image/') || /gif|svg/.test(file.type)) return file;
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    let { naturalWidth: w, naturalHeight: h } = img; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(img.src);
    const type = file.type === 'image/png' && file.size < 1.5e6 ? 'image/png' : 'image/jpeg';
    const blob = await new Promise(r => cv.toBlob(r, type, q));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, '') + (type === 'image/png' ? '.png' : '.jpg'), { type }) : file;
  } catch { return file; }
}
async function upload(file, max) {
  const f = await compress(file, max);
  if (f.size > 25 * 1024 * 1024) throw new Error(file.name + ' is over 25 MB');
  const ext = (f.name.match(/\.(\w{1,6})$/) || [, 'bin'])[1].toLowerCase();
  const path = `${me.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from('media').upload(path, f, { contentType: f.type || 'application/octet-stream', cacheControl: '31536000' });
  if (error) throw error;
  const { data } = sb.storage.from('media').getPublicUrl(path);
  return { url: data.publicUrl, path, name: file.name, type: f.type, size: f.size };
}
async function removeFiles(paths) { paths = paths.filter(p => p && p.startsWith(me.id + '/')); if (paths.length) await sb.storage.from('media').remove(paths); }
function pickFiles(accept, multiple = true) {
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept || ''; inp.multiple = multiple;
    inp.onchange = () => res([...inp.files]); inp.click();
  });
}
async function addFiles(files) {
  for (const file of files.slice(0, 10)) {
    const item = { uploading: true, name: file.name, type: file.type }; S.pending.push(item); renderPending();
    try { Object.assign(item, await upload(file), { uploading: false }); }
    catch (e) { S.pending = S.pending.filter(x => x !== item); toast('Upload failed: ' + errMsg(e)); }
    renderPending();
  }
}

const AI_PRESETS = {

const isBot = c => c?.extra === 'bot';
function aiCfg() { const c = LS.get('ai', {}); const prov = AI_PRESETS[c.provider] ? c.provider : 'groq'; const p = AI_PRESETS[prov]; return { provider: prov, key: c.key || '', url: c.url || p.url, model: c.model || p.model }; }
function botsHere() {
  if (!S.chan || S.chan._dm) return [];
  const ok = ch => isBot(ch) && !S.blocks.has(ch.id) && (ch.owner_id === me.id || ch.visibility === 'public' || (ch.visibility === 'restricted' && (ch.allowed_users || []).includes(me.id)));
  const map = new Map(); [...S.myChars, ...S.worldChars].forEach(c => ok(c) && map.set(c.id, c)); return [...map.values()];
}
const botPartner = () => S.chan ? LS.get('botPartner', {})[S.chan.id] : null;
async function botTriggers(m) {
  if (!S.chan || S.chan._dm || (m.character_id && isBot(S.chars[m.character_id]))) return;
  const here = botsHere(); if (!here.length) return;
  const ids = new Set();
  (m.mentions || []).forEach(x => x.c && here.some(b => b.id === x.c) && ids.add(x.c));
  if (m.reply_to) { const r = S.msgs.find(x => x.id === m.reply_to) || S.extraMsgs[m.reply_to]; if (r?.character_id && here.some(b => b.id === r.character_id)) ids.add(r.character_id); }
  const p = botPartner(); if (p && here.some(b => b.id === p)) ids.add(p);
  for (const id of ids) await botReply(S.chars[id]);
}
const botBusy = new Set();
async function botReply(bot) {
  const cfg = aiCfg(); if (!cfg.key) { toast('🤖 Add a free AI key in Profile → AI bots first (tap here)', () => setTab('profile')); return; }
  const chan = S.chan, k = bot.id + chan.id; if (botBusy.has(k)) return; botBusy.add(k);
  S.typing['bot:' + bot.id] = { l: bot.name, t: Date.now() + 90000 }; renderTyping();
  room?.send({ type: 'broadcast', event: 'typing', payload: { u: 'bot:' + bot.id, l: bot.name } });
  try {
    const text = await aiGenerate(bot, S.msgs.filter(m => !m.deleted && (m.content || m.attachments?.length)).slice(-30), cfg);
    if (!text) throw new Error('the AI sent back an empty reply');
    const { data, error } = await sb.from('messages').insert({ channel_id: chan.id, author_id: me.id, character_id: bot.id, content: text.slice(0, 6000), attachments: [], mentions: [], reply_to: null }).select().single();
    if (error) throw error;
    if (S.chan?.id === chan.id) addIncoming([data]);
  } catch (e) { toast('🤖 ' + bot.name + ' couldn’t reply: ' + errMsg(e)); }
  finally { delete S.typing['bot:' + bot.id]; renderTyping(); botBusy.delete(k); }
}
async function aiGenerate(bot, hist, cfg) {
  const w = S.world;
  const sys = `You are ${bot.name}, a character in a group text roleplay${w ? ` set in "${w.name}"` : ''}${w?.description ? ` — ${w.description}` : ''}.

Who ${bot.name} is and how they act:
${bot.personality || 'Improvise a vivid, believable personality and keep it consistent.'}

Rules:
- Write ONLY ${bot.name}'s next message. Never write dialogue or actions for anyone else's character, and never decide what they do.
- Style: actions in *asterisks*, spoken words in "quotes". Match the length and energy of the conversation — usually 1–3 short paragraphs.
- React genuinely to what was just said or done. Stay in character, have opinions, emotions and agency. Never mention being an AI.
- Don't start with your own name. Lines marked (OOC) are players talking out of character.`;
  const msgs = [{ role: 'system', content: sys }];
  for (const m of hist) {
    const c = m.character_id && S.chars[m.character_id], mine = m.character_id === bot.id;
    const content = mine ? m.content : `${c ? c.name : pname(m.author_id) + ' (OOC)'}: ${m.content || '[sent an image]'}`;
    const role = mine ? 'assistant' : 'user', last = msgs[msgs.length - 1];
    if (last.role === role) last.content += '\n\n' + content; else msgs.push({ role, content });
  }
  if (msgs[1]?.role === 'assistant') msgs.splice(1, 0, { role: 'user', content: '(The scene begins.)' });
  if (msgs[msgs.length - 1].role !== 'user') msgs.push({ role: 'user', content: `(Continue as ${bot.name}.)` });
  const headers = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.key };
  if (cfg.provider === 'openrouter') { headers['HTTP-Referer'] = location.origin; headers['X-Title'] = 'Cast'; }
  let res;
  try { res = await fetch(cfg.url, { method: 'POST', headers, body: JSON.stringify({ model: cfg.model, messages: msgs, temperature: 0.9, max_tokens: 600 }) }); }
  catch { throw new Error('couldn’t reach the AI service (check the service/URL, or try another one in Profile)'); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((Array.isArray(j) ? j[0]?.error?.message : j.error?.message) || j.message || 'error ' + res.status);
  let t = (j.choices?.[0]?.message?.content || '').trim();
  const nm = bot.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  t = t.replace(new RegExp('^\\**' + nm + '\\**\\s*:\\s*', 'i'), '').trim();
  return t;
}

/* character editor */
function charEditor(id, thenPlay = false, preset = {}) {
  const c = id ? { ...S.chars[id] } : { name: '', extra: preset.bot ? 'bot' : '', personality: '', bio: '', avatar_url: null, gallery: [], visibility: 'private', allowed_users: [], color: ['#f0a9b8', '#9fc8f2', '#b5e3a1', '#f3d48b', '#c9a7f5', '#f5a77a'][Math.floor(Math.random() * 6)] };
  const oldAvatarPath = (c.gallery || []).find(g => g.url === c.avatar_url)?.path;
  let newPath = null;
  const allowedNames = (c.allowed_users || []).map(u => S.profiles[u]?.username).filter(Boolean).join(', ');
  const el = modal(isBot(c) ? (id ? 'Edit AI bot' : 'New AI bot') : (id ? 'Edit character' : 'New character'), `
    <div style="text-align:center;margin:4px 0 18px"><button id="ce-av" style="display:inline-block;position:relative" title="Choose picture">${av(c.avatar_url, c.name || '?', 'xl')}
      <span style="position:absolute;right:2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:17px;border:3px solid var(--bg2)">📷</span></button>
      <div class="tiny faint" style="margin-top:8px">Tap to ${c.avatar_url ? 'change' : 'add'} picture</div></div>
    <label class="field"><span>Name</span><input class="inp" id="ce-name" value="${esc(c.name)}" placeholder="Mia Thompson" maxlength="80"></label>
    <label class="check"><input type="checkbox" id="ce-bot" ${isBot(c) ? 'checked' : ''}> 🤖 AI bot — writes its own replies</label>
    <div id="ce-botf" class="${isBot(c) ? '' : 'hidden'}" style="margin-top:8px">
      <label class="field"><span>Personality — who they are & how they act</span><textarea class="inp" id="ce-pers" rows="5" placeholder="Jayden, 18. Star quarterback, cocky but secretly insecure. Teases people he likes. Talks casually, uses slang, hates being ignored.">${esc(c.personality || '')}</textarea></label>
      <label class="field"><span>Opening message (optional)</span><textarea class="inp" id="ce-greet" rows="2" placeholder='*leans against the locker* "You lost or something?"'>${esc(isBot(c) ? c.bio || '' : '')}</textarea></label>
    </div>
    <details ${c.visibility !== 'private' ? 'open' : ''}><summary class="small muted" style="cursor:pointer;padding:6px 0">Sharing: who can play this character?</summary>
      <div class="seg" style="margin-top:8px">${[['private', '🔒 Only me'], ['public', '🌐 Anyone'], ['restricted', '👥 Specific people']].map(([v, l]) => `<label><input type="radio" name="vis" value="${v}" ${c.visibility === v ? 'checked' : ''}>${l}</label>`).join('')}</div>
      <label class="field ${c.visibility === 'restricted' ? '' : 'hidden'}" id="ce-allow" style="margin-top:10px"><span>Usernames allowed (comma separated)</span><input class="inp" id="ce-allowed" value="${esc(allowedNames)}" placeholder="alex, josh" autocapitalize="off"></label></details>`,
    `${id ? `<button class="btn danger" data-ce="del" style="margin-right:auto">Delete</button>` : ''}<button class="btn ghost" data-act="close-modal">Cancel</button><button class="btn primary" data-ce="save">${id ? 'Save' : 'Create'}</button>`);
  const avr = () => { $('#ce-av', el).firstElementChild.outerHTML = av(c.avatar_url, $('#ce-name', el).value || '?', 'xl'); };
  $('#ce-bot', el).onchange = e => $('#ce-botf', el).classList.toggle('hidden', !e.target.checked);
  $$('input[name=vis]', el).forEach(r => r.onchange = () => $('#ce-allow', el).classList.toggle('hidden', r.value !== 'restricted'));
  if (!id && !isMobile()) setTimeout(() => $('#ce-name', el)?.focus(), 50);
  el.addEventListener('click', async e => {
    if (e.target.closest('#ce-av')) {
      const [file] = await pickFiles('image/*', false); if (!file) return;
      try { const up = await upload(file, 1000); if (newPath) removeFiles([newPath]); newPath = up.path; c.avatar_url = up.url; avr(); } catch (er) { toast(errMsg(er)); }
      return;
    }
    const b = e.target.closest('[data-ce]'); if (!b) return; const a = b.dataset.ce;
    if (a === 'del') {
      if (!confirm(`Delete ${c.name}? Their old messages stay but show as an unknown character.`)) return;
      const { error } = await sb.from('characters').delete().eq('id', id); if (error) return toast(errMsg(error));
      removeFiles((c.gallery || []).map(g => g.path)); delete S.chars[id]; await loadMyChars(); closeModal(); refreshAfterChars();
    }
    if (a === 'save') {
      const name = $('#ce-name', el).value.trim(); if (!name) return toast('Give your character a name.');
      const row = { name, avatar_url: c.avatar_url, visibility: $('input[name=vis]:checked', el).value, allowed_users: [] };
      if ($('#ce-bot', el).checked) { row.extra = 'bot'; row.personality = $('#ce-pers', el).value.trim(); row.bio = $('#ce-greet', el).value.trim(); } else if (isBot(c)) { row.extra = ''; }
      row.gallery = newPath ? [{ url: c.avatar_url, path: newPath }] : (c.gallery || []).filter(g => g.url === c.avatar_url);
      if (row.visibility === 'restricted') {
        const names = $('#ce-allowed', el).value.split(',').map(s => s.trim().replace(/^@/, '').toLowerCase()).filter(Boolean);
        if (names.length) { const { data } = await sb.from('profiles').select('*').in('username', names); (data || []).forEach(p => S.profiles[p.id] = p); row.allowed_users = (data || []).map(p => p.id); const miss = names.filter(n => !(data || []).some(p => p.username.toLowerCase() === n)); if (miss.length) toast('Not found: ' + miss.join(', ')); }
      }
      if (!id) row.color = c.color;
      b.disabled = true;
      const q = id ? sb.from('characters').update(row).eq('id', id).select().single() : sb.from('characters').insert({ ...row, owner_id: me.id }).select().single();
      const { data, error } = await q; b.disabled = false; if (error) return toast(errMsg(error));
      S.chars[data.id] = data;
      if (newPath && oldAvatarPath) removeFiles([oldAvatarPath]);
      newPath = null;
      await loadMyChars(); closeModal();
      if (S.world) { const i = S.worldChars.findIndex(x => x.id === data.id); if (i >= 0) S.worldChars[i] = data; else S.worldChars.push(data); }
      if (thenPlay && S.chan && isRP()) setPlaying(data.id);
      toast(id ? 'Saved ✓' : isBot(data) ? `🤖 ${data.name} is ready — tap 🤖 in a roleplay channel to chat` : `🎭 ${data.name} is ready to play`); refreshAfterChars();
    }
  });
}
function refreshAfterChars() { if (S.chan) { renderChatHeader(); renderComposerChip(); renderMsgs('keep'); renderRight(); } else renderMain(); }

function charProfile(id) {
  const c = S.chars[id]; if (!c) return toast('Character not found');
  const mine = c.owner_id === me.id, w = S.world;
  const usable = S.chan && isRP() && usableChars().all.some(x => x.id === id);
  const canCharDM = w && w.allow_char_dms && !mine && S.myChars.length;
  const el = modal('', `<div style="text-align:center;margin-top:-8px">
      <div class="av xl" style="margin:0 auto;width:160px;height:160px;font-size:54px;background:hsl(${hue(c.name)} 38% 38%)">${c.avatar_url ? `<img src="${esc(c.avatar_url)}" alt="" data-act="lightbox" data-src="${esc(c.avatar_url)}" style="cursor:zoom-in">` : esc(initials(c.name))}</div>
      <div class="h-display" style="font-size:28px;margin-top:12px;color:${esc(c.color)}">${esc(c.name)}</div>
      ${isBot(c) ? `<div style="margin-top:6px"><span class="pill" style="color:var(--accent)">🤖 AI bot</span></div>${c.personality ? `<div class="small muted" style="margin:10px auto 0;max-width:40ch;white-space:pre-wrap">${esc(c.personality.slice(0, 300))}</div>` : ''}` : ''}
      <div class="muted small" style="margin-top:4px">${isBot(c) ? 'Created' : 'Played'} by <a href="#" data-act="user" data-id="${c.owner_id}">${esc(pname(c.owner_id))}</a></div>
      ${w && S.blocks.has(c.id) ? '<div style="margin-top:8px"><span class="pill" style="color:var(--danger)">⛔ Blocked in this world</span></div>' : ''}</div>`,
    `${w && myRank() >= 4 && !mine ? `<button class="btn sm danger" data-cp="block" style="margin-right:auto">${S.blocks.has(c.id) ? 'Unblock here' : 'Block from world'}</button>` : ''}
     ${canCharDM ? `<button class="btn sm ghost" data-cp="rpdm">🎭 RP DM</button>` : ''}

  el.addEventListener('click', async e => {

    if (a === 'edit') charEditor(id);
    if (a === 'play') { closeModal(); setPlaying(id); }

      const q = S.blocks.has(id) ? sb.from('world_char_blocks').delete().eq('world_id', w.id).eq('character_id', id) : sb.from('world_char_blocks').insert({ world_id: w.id, character_id: id });
      const { error } = await q; if (error) return toast(errMsg(error));
      S.blocks.has(id) ? S.blocks.delete(id) : S.blocks.add(id); closeModal(); renderRight(); toast('Updated');
    }
    if (a === 'rpdm') {

        pop.onclick = async ev => {
          const bb = ev.target.closest('[data-as]'); if (!bb) return;
          const { data, error } = await sb.rpc('open_dm', { other: c.owner_id, w: w.id, ca: bb.dataset.as, cb: c.id });
          if (error) return toast(errMsg(error));
          pop.remove(); closeModal(); await loadDMs(); const t = S.dms.find(d => d.id === data); if (t) { const map = LS.get('play', {}); map[t.id] = bb.dataset.as; LS.set('play', map); openDM(t); }
        };

}

async function userProfile(uid) {
  await ensureProfiles([uid]); const p = S.profiles[uid]; if (!p) return;
  const w = S.world, mem = w && S.members.find(m => m.user_id === uid), my = myRank();
  const theirs = (w ? S.worldChars : []).filter(c => c.owner_id === uid);
  if (!w) { const { data } = await sb.from('characters').select('*').eq('owner_id', uid); (data || []).forEach(c => { S.chars[c.id] = c; theirs.push(c); }); }
  const canManage = mem && uid !== me.id && my >= 4 && RANK[mem.role] < my;
  const canKick = mem && uid !== me.id && my >= 3 && RANK[mem.role] < my;
  const st = statusOf(uid);
  const el = modal('', `<div class="row" style="gap:16px;margin-top:-6px"><div class="dotwrap">${av(p.avatar_url, pname(uid), 'lg')}<span class="pdot ${st}" style="width:18px;height:18px;border-width:3px"></span></div>
      <div class="grow"><div class="h-display" style="font-size:24px">${esc(pname(uid))}</div><div class="muted small">@${esc(p.username)} · ${{ online: '🟢 Online', idle: '🌙 Idle', offline: '⚫ Offline' }[st]}</div>
      ${mem ? `<div style="margin-top:6px"><span class="pill">${ROLE_META[mem.role].join(' ')}</span></div>` : ''}</div></div>
    ${p.bio ? `<div class="sect">About</div><div class="prose">${esc(p.bio)}</div>` : ''}
    <div class="sect">Characters${w ? ' in this world' : ''}</div>
    ${theirs.length ? theirs.map(c => `<div class="mem" data-act="char" data-id="${c.id}">${av(c.avatar_url, c.name, 'sm')}<div class="grow"><div style="font-weight:700;color:${esc(c.color)}">${esc(c.name)}</div></div></div>`).join('') : '<div class="small faint">No characters yet.</div>'}
    ${canManage ? `<div class="sect">Role</div><select class="inp" id="up-role">${['admin', 'moderator', 'member', 'guest'].filter(r => RANK[r] < my).map(r => `<option value="${r}" ${mem.role === r ? 'selected' : ''}>${ROLE_META[r].join(' ')}</option>`).join('')}</select>` : ''}`,
    `${canKick ? `<button class="btn sm danger" data-up="kick" style="margin-right:auto">Remove from world</button>` : ''}${uid !== me.id ? `<button class="btn sm primary" data-up="dm">💬 Message</button>` : `<button class="btn sm ghost" data-act="tab" data-tab="profile">Edit profile</button>`}`);
  const sel = $('#up-role', el); if (sel) sel.onchange = async () => { const { error } = await sb.rpc('set_member_role', { w: w.id, target: uid, new_role: sel.value }); if (error) return toast(errMsg(error)); mem.role = sel.value; renderRight(); toast('Role updated'); };
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-up]'); if (!b) return;
    if (b.dataset.up === 'dm') { const { data, error } = await sb.rpc('open_dm', { other: uid }); if (error) return toast(errMsg(error)); closeModal(); await loadDMs(); const t = S.dms.find(d => d.id === data); if (t) openDM(t); }
    if (b.dataset.up === 'kick') { if (!confirm(`Remove ${pname(uid)} from ${w.name}?`)) return; const { error } = await sb.rpc('kick_member', { w: w.id, target: uid }); if (error) return toast(errMsg(error)); closeModal(); await loadWorldData(); renderAll(); }
  });
}

const inviteLink = w => location.origin + location.pathname + '#join=' + w.invite_code;

/* notifications */
async function openNotif(n) {
  if (!n.read && n.kind !== 'invite') { n.read = true; sb.from('notifications').update({ read: true }).eq('id', n.id); renderRail(); renderNav(); }
  if (n.kind === 'invite') { setTab('notifs'); return; }
  if (n.dm_id) { let d = S.dms.find(x => x.id === n.dm_id); if (!d) { await loadDMs(); d = S.dms.find(x => x.id === n.dm_id); } if (d) { await openDM(d); if (n.message_id) jumpTo(n.message_id); } return; }
  if (n.channel_id && n.world_id) {
    if (!S.worlds.find(w => w.id === n.world_id)) return toast('You’re not in that world anymore.');
    await openWorld(n.world_id, n.channel_id);
    if (S.chan?.id !== n.channel_id) { const c = S.channels.find(x => x.id === n.channel_id); if (c) await openChannel(c); else return toast('Channel not available'); }
    if (n.message_id) jumpTo(n.message_id);
  }
}
async function respondInvite(inviteId, yes) {
  const { data, error } = await sb.rpc('respond_invite', { inv: inviteId, accept: yes }); if (error) return toast(errMsg(error));
  S.notifs.filter(n => n.invite_id === inviteId).forEach(n => n.read = true);
  if (yes) { await loadWorlds(); await openWorld(data); toast('Welcome in!'); } else { renderMain(); renderNav(); renderRail(); }
}

}
function emojiPicker(anchor, id) {
  popover(anchor, `<div class="ptitle">React</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px">${MORE_EMO.map(e => `<button class="mi" style="justify-content:center;font-size:22px;padding:6px;min-height:44px" data-em="${e}">${e}</button>`).join('')}</div>`,
    pop => pop.onclick = ev => { const b = ev.target.closest('[data-em]'); if (b) { pop.remove(); react(id, b.dataset.em); } });
}
function mobileMsgSheet(id) {
  const m = S.msgs.find(x => x.id === id); if (!m || m.deleted) return;
  const own = m.author_id === me.id, mod = !S.chan._dm && myRank() >= 3;
  popover(null, `<div style="display:flex;justify-content:space-around;padding:6px 4px 10px">${QUICK.map(e => `<button style="font-size:26px;width:46px;height:46px;border-radius:50%;background:var(--panel)" data-ms="react" data-e="${e}">${e}</button>`).join('')}</div>
    <button class="mi" data-ms="reply">↩️ Reply</button>
    ${m.character_id ? `<button class="mi" data-ms="char">🎭 View ${esc(S.chars[m.character_id]?.name || 'character')}</button>` : ''}
    ${!S.chan._dm && canPost() ? `<button class="mi" data-ms="scene">🧵 Create scene from this</button>` : ''}
    <button class="mi" data-ms="copy">📋 Copy text</button>
    ${own ? `<button class="mi" data-ms="edit">✏️ Edit</button>` : ''}${own || mod ? `<button class="mi dz" data-ms="del">🗑️ Delete</button>` : ''}`, pop => pop.onclick = e => {
    const b = e.target.closest('[data-ms]'); if (!b) return; pop.remove(); const a = b.dataset.ms;
    if (a === 'react') react(id, b.dataset.e); if (a === 'reply') { S.replyTo = id; S.editing = null; renderBar(); $('#ctext')?.focus(); }
    if (a === 'char') charProfile(m.character_id); if (a === 'scene') sceneModal(id); if (a === 'copy') { navigator.clipboard?.writeText(m.content); toast('Copied'); }
    if (a === 'edit') startEdit(id); if (a === 'del') deleteMsg(id);
  });
}

/* ---------- global click delegation ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    // mobile: tap a message for actions
    const msg = e.target.closest('.msg[data-mid]');
    if (msg && isMobile() && !e.target.closest('a,img,.who,.pb,.gut,.mention,.rx,.rep,.spoiler')) mobileMsgSheet(msg.dataset.mid);
    return;
  }
  const a = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A' && a) e.preventDefault();
  switch (a) {
    case 'tab': closeModal(); if (el.dataset.tab === 'home' && isMobile() && S.tab === 'world' && S.mpane === 'side') { S.world = null; } setTab(el.dataset.tab); break;
    case 'world': closePop(); await openWorld(id); if (isMobile() && !S.chan) { S.mpane = 'side'; renderAll(); } break;
    case 'chan': { const c = S.channels.find(x => x.id === id); if (e.target.closest('.gear')) return; if (c) openChannel(c); break; }
    case 'chan-settings': e.stopPropagation(); channelSettings(id); break;
    case 'dm': { const d = S.dms.find(x => x.id === id); if (d) openDM(d); break; }
    case 'mback': { closeChat(); S.mpane = 'side'; if (S.tab === 'world' || S.tab === 'messages') { renderAll(); renderMain(); } else render(); break; }
    case 'create-world': createWorld(); break;
    case 'join-code': joinCodeModal(); break;
    case 'preview-world': previewPublic(id); break;
    case 'add-chan': addChannel(el.dataset.kind); break;
    case 'world-menu': worldMenu(el); break;
    case 'invite': inviteModal(); break;
    case 'search': searchModal(); break;
    case 'new-dm': newDM(); break;
    case 'new-char': charEditor(null); break;
    case 'new-bot': charEditor(null, false, { bot: true }); break;
    case 'edit-char': e.stopPropagation(); charEditor(id); break;
    case 'char': closePop(); charProfile(id); break;
    case 'user': closePop(); userProfile(id); break;
    case 'pick-char': charPicker(el); break;
    case 'bots': botMenu(el); break;
    case 'ai-save': LS.set('ai', readAiForm()); $('#ai-st').textContent = 'Saved ✓'; break;
    case 'ai-test': { const cfg = { ...aiCfg(), ...Object.fromEntries(Object.entries(readAiForm()).filter(([, v]) => v)) }; $('#ai-st').textContent = 'Testing…'; try { const t = await aiGenerate({ name: 'Test Bot', personality: 'Cheerful and brief.' }, [{ author_id: me.id, content: 'Say hi in one short sentence.' }], cfg); $('#ai-st').textContent = '✓ Works! Bot said: ' + t.slice(0, 80); LS.set('ai', readAiForm()); } catch (er) { $('#ai-st').textContent = '✗ ' + errMsg(er); } break; }
    case 'toggle-right': if (isMobile()) { renderRight(); $('#right').classList.add('open'); } else { S.showRight = !S.showRight; LS.set('showRight', S.showRight); renderAll(); } break;
    case 'close-right': $('#right').classList.remove('open'); break;
    case 'rtab': S.rightTab = el.dataset.t; renderRight(); if (isMobile()) $('#right').classList.add('open'); break;
    case 'follow': {
      const c = S.chan; if (S.follows.has(c.id)) { await sb.from('channel_follows').delete().eq('user_id', me.id).eq('channel_id', c.id); S.follows.delete(c.id); toast('Unfollowed #' + c.name); }
      else { const { error } = await sb.from('channel_follows').insert({ user_id: me.id, channel_id: c.id }); if (error) return toast(errMsg(error)); S.follows.add(c.id); toast('🔔 You’ll be notified about new messages in #' + c.name); }
      renderChatHeader(); break;
    }
    case 'send': sendMessage(); break;
    case 'attach': popover(el, `<button class="mi" data-at="img">📷 Image</button><button class="mi" data-at="gif">🖼️ GIF</button><button class="mi" data-at="file">📁 File</button><button class="mi" data-at="link">🔗 Link</button>`, pop => pop.onclick = async ev => {
      const b = ev.target.closest('[data-at]'); if (!b) return; pop.remove(); const t = b.dataset.at;
      if (t === 'link') { const u = prompt('Paste a link'); if (u) { const ta = $('#ctext'); ta.value += (ta.value && !/\s$/.test(ta.value) ? ' ' : '') + u.trim() + ' '; autosize(); ta.focus(); } return; }
      const files = await pickFiles(t === 'img' ? 'image/*' : t === 'gif' ? 'image/gif' : '', true); if (files.length) addFiles(files);
    }); break;
    case 'unpend': { const it = S.pending.splice(+el.dataset.i, 1)[0]; if (it?.path) removeFiles([it.path]); renderPending(); break; }
    case 'cancel-bar': cancelBar(); break;
    case 'older': loadMessages(true); break;
    case 'react': react(id, el.dataset.e); break;
    case 'react-more': emojiPicker(el, id); break;
    case 'reply': S.replyTo = id; S.editing = null; renderBar(); $('#ctext')?.focus(); break;
    case 'edit': startEdit(id); break;
    case 'del': deleteMsg(id); break;
    case 'scene': sceneModal(id); break;
    case 'jump': jumpTo(id); break;
    case 'spoil': el.classList.toggle('open'); break;
    case 'lightbox': {
      const modalEl = el.closest('.modal'); let list;
      if (modalEl?.dataset.gal) list = JSON.parse(modalEl.dataset.gal);
      else if (el.dataset.gal != null) list = $$('[data-gal]', el.closest('.gal')).map(x => x.dataset.src);
      else list = $$('.atts img', el.closest('.atts')).map(x => x.dataset.src);
      lightbox(el.dataset.src, list); break;
    }
    case 'lb-close': $('#lightbox').classList.remove('open'); break;
    case 'lb-prev': lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; lbShow(); break;
    case 'lb-next': lbIdx = (lbIdx + 1) % lbList.length; lbShow(); break;
    case 'close-modal': closeModal(); break;
    case 'notif': if (e.target.closest('[data-act=inv-yes],[data-act=inv-no]')) return; openNotif(S.notifs.find(n => n.id === id)); break;
    case 'inv-yes': respondInvite(id, true); break;
    case 'inv-no': respondInvite(id, false); break;
    case 'notif-readall': await sb.from('notifications').update({ read: true }).eq('user_id', me.id).neq('kind', 'invite'); S.notifs.forEach(n => n.kind !== 'invite' && (n.read = true)); render(); break;
    case 'notif-clear': await sb.from('notifications').delete().eq('user_id', me.id).eq('read', true); S.notifs = S.notifs.filter(n => !n.read); render(); break;
    case 'pf-save': {
      const un = $('#pf-un').value.trim().replace(/[^a-zA-Z0-9_]/g, '');
      if (un.length < 2) return toast('Username needs 2+ letters/numbers');
      const { data, error } = await sb.from('profiles').update({ display_name: $('#pf-dn').value.trim() || un, username: un, bio: $('#pf-bio').value.trim() }).eq('id', me.id).select().single();
      if (error) return toast(/unique|duplicate/i.test(error.message) ? 'That username is taken' : errMsg(error));
      me = data; S.profiles[me.id] = me; toast('Profile saved ✓'); renderAll(); renderMain(); break;
    }
    case 'pf-avatar': { const [f] = await pickFiles('image/*', false); if (!f) return; try { const up = await upload(f, 600); const { data } = await sb.from('profiles').update({ avatar_url: up.url }).eq('id', me.id).select().single(); me = data; S.profiles[me.id] = me; renderAll(); renderMain(); } catch (er) { toast(errMsg(er)); } break; }
    case 'pf-avatar-rm': { const { data } = await sb.from('profiles').update({ avatar_url: null }).eq('id', me.id).select().single(); me = data; S.profiles[me.id] = me; renderAll(); renderMain(); break; }
    case 'pf-accent': LS.set('accent', el.dataset.c); applyTheme(); renderMain(); break;
    case 'signout': await sb.auth.signOut(); location.reload(); break;
  }
});
addEventListener('resize', () => { const s = $('#shell'); if (s) { s.classList.toggle('noright', !(S.tab === 'world' && S.chan && S.showRight) || isMobile()); } });
</script>
</body>
